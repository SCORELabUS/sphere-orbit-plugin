name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JSON files
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Check the bridge syntax
        run: node --check desktop-extension/server/index.js

      - name: Build the extension
        run: ./scripts/build-extension.sh

      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code@2.1.299 plugin validate --strict ./plugins/sphere

      - name: Validate Claude Code marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.299 plugin validate --strict .

      - name: Check that the extension and the plugin share the version
        run: |
          extension=$(python3 -c "import json; print(json.load(open('desktop-extension/manifest.json'))['version'])")
          plugin=$(python3 -c "import json; print(json.load(open('plugins/sphere/.claude-plugin/plugin.json'))['version'])")
          if [ "$extension" != "$plugin" ]; then
            echo "Version mismatch: extension $extension, plugin $plugin"
            exit 1
          fi
